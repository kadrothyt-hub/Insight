name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.insight --project-name insight --platforms=android tmp_app
          cp main.dart tmp_app/lib/main.dart
          cp pubspec.yaml tmp_app/pubspec.yaml
          cd tmp_app
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: insight-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
